name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  linux-x86_64:
    name: Linux x86-64 (Build, Test, ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build all targets
        run: make -j$(nproc) all

      - name: Test standalone single-header decoder (lz0dec_min.h)
        run: |
          printf '#define LZ0DEC_IMPLEMENTATION\n#include "lz0dec_min.h"\n' | \
            gcc -x c - -O2 -Ilz0 -Wall -Wextra -Werror -c -o /tmp/lz0dec_min_hdr.o
          rm -f /tmp/lz0dec_min_hdr.o

      - name: Run unit tests, CLI check, SIMD tier parity, and quick benchmark
        run: make test && make enc_tiers && make cli

      - name: Run ASan + UBSan suite
        run: make sanitize

  rust-nostd:
    name: 'Rust #![no_std] (Safe & Fast, Bare-Metal, PROT_NONE)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: thumbv7em-none-eabihf, aarch64-unknown-none, riscv64gc-unknown-none-elf, x86_64-unknown-none

      - name: Format, clippy, and unit/fuzz tests
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --check
          cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          cargo test --manifest-path rust/Cargo.toml -p lz0-dec --no-default-features
          cargo test --manifest-path rust/Cargo.toml -p lz0-dec --all-features

      - name: Verify bare-metal #![no_std] compilation
        run: |
          for tgt in thumbv7em-none-eabihf aarch64-unknown-none riscv64gc-unknown-none-elf x86_64-unknown-none; do
            cargo check --manifest-path rust/Cargo.toml -p lz0-dec --target "$tgt" --no-default-features
            cargo check --manifest-path rust/Cargo.toml -p lz0-dec --target "$tgt" --features fast
          done

      - name: Run C <-> Rust PROT_NONE guard-page differential tests
        run: make test_rust

  linux-cross-qemu:
    name: Linux Cross QEMU (ARM64 + RISC-V 64 Scalar & RVV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilers and QEMU user emulators
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            gcc-riscv64-linux-gnu \
            libc6-dev-riscv64-cross
          sudo apt-get install -y qemu-user-static || \
            sudo apt-get install -y qemu-user

      - name: Run ARM64 tests under QEMU
        run: |
          A64_EMU="$(command -v qemu-aarch64-static || command -v qemu-aarch64)"
          make test_arm64 ARM64_EMU="$A64_EMU" && make bin/lz0_arm64 bin/lz0dec_arm64

      - name: Run RISC-V 64 (scalar + RVV) tests under QEMU
        run: |
          RV64_EMU="$(command -v qemu-riscv64-static || command -v qemu-riscv64)"
          make bin/lz0_riscv64 bin/lz0dec_riscv64
          RV64_EMU_V="$RV64_EMU"
          if "$RV64_EMU" -cpu rv64,v=true,vlen=128 ./bin/lz0dec_riscv64 -v >/dev/null 2>&1; then
            RV64_EMU_V="$RV64_EMU -cpu rv64,v=true,vlen=128"
          elif "$RV64_EMU" -cpu max,v=true,vlen=128 ./bin/lz0dec_riscv64 -v >/dev/null 2>&1; then
            RV64_EMU_V="$RV64_EMU -cpu max,v=true,vlen=128"
          fi
          echo "Using RISCV64_EMU_V=$RV64_EMU_V"
          make test_riscv64 RISCV64_EMU="$RV64_EMU" RISCV64_EMU_V="$RV64_EMU_V"

  windows-native:
    name: Windows x86-64 (MSYS2 MinGW-w64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            make
            diffutils

      - name: Build and run Windows unit tests and CLIs
        run: make test_windows MINGW_CC=gcc RUN_WIN="" && make enc_tiers CC=gcc RUN_WIN=""

  macos-arm64:
    name: macOS ARM64 (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run native macOS ARM64 tests
        run: make -j$(sysctl -n hw.ncpu) lz0 lz0dec cli vectors boundary malformed fuzz guard simd sa_probe enc_tiers threadsafe window limits

      - name: Run decompression benchmark smoke
        run: make bench_dec

      - name: Package macOS ARM64 tarball (on release tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="${GITHUB_REF_NAME#v}"
          rm -f bin/lz0 bin/lz0dec
          make dist_macos VERSION="$VER"

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: dist-macos-arm64
          path: dist/lz0-v*-macos-*.tar.gz

  release:
    name: Package & Publish Release
    needs: [linux-x86_64, linux-cross-qemu, windows-native, macos-arm64, rust-nostd]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux/Windows cross-compilers and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-mingw-w64-x86-64 \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            gcc-riscv64-linux-gnu \
            libc6-dev-riscv64-cross \
            zip

      - name: Setup musl static cross-toolchains for compact ARM64/RV64 binaries
        run: |
          mkdir -p /tmp/musl-tc
          ARM64_CC_BIN="aarch64-linux-gnu-gcc"
          RV64_CC_BIN="riscv64-linux-gnu-gcc"
          if curl -4 -fsSL --connect-timeout 15 --max-time 60 --speed-limit 50000 --speed-time 15 --retry 1 https://musl.cc/aarch64-linux-musl-cross.tgz -o /tmp/musl-tc/a64.tgz; then
            tar -xzf /tmp/musl-tc/a64.tgz -C /tmp/musl-tc
            ARM64_CC_BIN="/tmp/musl-tc/aarch64-linux-musl-cross/bin/aarch64-linux-musl-gcc"
          fi
          if curl -4 -fsSL --connect-timeout 15 --max-time 60 --speed-limit 50000 --speed-time 15 --retry 1 https://musl.cc/riscv64-linux-musl-cross.tgz -o /tmp/musl-tc/rv64.tgz; then
            tar -xzf /tmp/musl-tc/rv64.tgz -C /tmp/musl-tc
            RV64_CC_BIN="/tmp/musl-tc/riscv64-linux-musl-cross/bin/riscv64-linux-musl-gcc"
          fi
          echo "ARM64_CC=$ARM64_CC_BIN" >> "$GITHUB_ENV"
          echo "RISCV64_CC=$RV64_CC_BIN" >> "$GITHUB_ENV"

      - name: Build distribution archives
        run: |
          VER="${GITHUB_REF_NAME#v}"
          make dist VERSION="$VER" ARM64_CC="$ARM64_CC" RISCV64_CC="$RISCV64_CC"

      - uses: actions/download-artifact@v4
        with:
          name: dist-macos-arm64
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum lz0-v* > SHA256SUMS
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
